<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opendesk Live Workbook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📓%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{--page:#fbe8a0;--rule:#e2c76c;--margin:#e48f80;--card:#fffbe3;--ink:#2f2a1c;--mute:#6b6040;--line:#b8a768;--pencil:#3b362a;--hl:#ffd84d;--acc:#8a6100;--danger:#b3261e;--edit-bg:#c9e6ff;--edit-ink:#0f2a44;--cover:#6b4a2b;--surface:var(--card);--bg:var(--page);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#2a2412;--rule:#40381c;--margin:#8a4a40;--card:#3a331b;--ink:#f4e9bd;--mute:#c9bc88;--line:#6b5f33;--pencil:#e6d9a6;--acc:#ffd84d;--danger:#ff8a80;--edit-bg:#274763;--edit-ink:#dcefff;--cover:#4a3320;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:'Patrick Hand','Segoe Print','Comic Sans MS',system-ui,sans-serif;font-size:1.08rem;color:var(--ink);min-height:100vh;background-color:var(--page);
background-image:linear-gradient(90deg,transparent 3.2rem,var(--margin) 3.2rem,var(--margin) calc(3.2rem + 2px),transparent calc(3.2rem + 2px)),repeating-linear-gradient(to bottom,transparent 0,transparent 1.9rem,var(--rule) 1.9rem,var(--rule) calc(1.9rem + 1px))}
h2{font-family:'Caveat','Patrick Hand',cursive!important;font-size:1.75rem!important;line-height:1.1!important;font-weight:700!important}
body>header{position:relative;z-index:60;background:var(--cover);color:#fff3b8;border-bottom:4px double #2b1c0e;box-shadow:0 3px 0 rgba(0,0,0,.2)}
body>header span,body>header b{color:#fff3b8!important}
body>header #netStat{border-color:#fff3b8!important}
.brand{font-family:'Caveat',cursive;font-size:2rem;font-weight:700;line-height:1;color:#fff3b8}
.card{background:var(--card);color:var(--ink);border:2px solid var(--pencil);border-radius:6px 16px 8px 14px;box-shadow:3px 4px 0 rgba(60,45,10,.22)}
.btn{font:inherit;font-size:1rem;padding:.35rem .85rem;border:2px solid var(--pencil);border-radius:8px 14px 9px 13px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:2px 3px 0 rgba(60,45,10,.28);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 4px 0 rgba(60,45,10,.3)}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tog:focus-visible,.field:focus-visible,.seg button:focus-visible,#splitBar:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn-p{background:var(--hl);color:#2f2a1c;font-weight:700}
.btn-d{color:var(--danger)}
.btn-edit{background:var(--edit-bg);color:var(--edit-ink);font-weight:700}
.tog{font:inherit;font-size:1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;padding:.45rem .7rem;border:2px solid var(--pencil);border-radius:8px 14px 9px 13px;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;box-shadow:2px 3px 0 rgba(60,45,10,.28)}
.tog i{width:38px;height:22px;border-radius:99px;border:2px solid var(--pencil);background:var(--card);position:relative;flex:none;transition:background .15s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--pencil);transition:transform .15s}
.tog[aria-pressed="true"] i{background:var(--hl)}
.tog[aria-pressed="true"] i::after{transform:translateX(16px)}
.field{width:100%;font:inherit;padding:.45rem .7rem;border:2px solid var(--pencil);border-radius:5px 11px 6px 10px;background:var(--card);color:var(--ink)}
textarea.field{line-height:1.9rem;padding:0 .7rem 0 2.6rem;background-attachment:local;
background-image:linear-gradient(90deg,transparent 2rem,var(--margin) 2rem,var(--margin) calc(2rem + 2px),transparent calc(2rem + 2px)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.9rem - 1px),var(--rule) calc(1.9rem - 1px),var(--rule) 1.9rem)}
textarea.field[readonly]{opacity:.7;border-style:dashed}
.field::placeholder{color:var(--mute);opacity:.8}
.seg{display:flex;gap:2px;padding:3px;border:2px solid var(--pencil);border-radius:12px;background:var(--card)}
.seg button{font:inherit;font-size:1rem;padding:.25rem .85rem;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--hl);color:#2f2a1c;font-weight:700}
.hl{background:var(--hl);color:#2f2a1c;border-radius:4px;padding:0 .4rem;font-weight:700;font-size:.85rem}
.lbl{font-size:1rem;font-weight:700;color:var(--mute);margin-bottom:.3rem}
.mode{display:inline-block;padding:.1rem .8rem;border:2px solid var(--pencil);border-radius:99px;font-weight:700;font-size:1rem}
.mode.draft{background:var(--hl);color:#2f2a1c}
.mode.done{background:#a5d6a7;color:#12331a}
.timer{font-family:'Caveat',cursive;font-size:1.9rem;font-weight:700;line-height:1.2;padding:0 1rem;border:3px solid #fff3b8;border-radius:12px;color:#fff3b8;background:rgba(0,0,0,.22);min-width:6rem;text-align:center}
.timer.low,.timer.done{background:#b3261e}
.timer.low{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.ws img{display:block;width:100%;height:auto;border-radius:6px;border:2px solid var(--pencil)}
img.rounded{background:#fffbe0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.on{background:#2e9e5b}
@media(min-width:1024px){#sAnsWrap{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto}}
@media(max-width:1023px){#sAnsWrap{position:sticky;bottom:.5rem;z-index:20;max-height:55vh;overflow:auto}}
